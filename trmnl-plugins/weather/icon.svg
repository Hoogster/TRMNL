<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9fe0"/>
      <stop offset="100%" stop-color="#2a6fb0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- sun -->
  <g stroke="#ffcf4d" stroke-width="18" stroke-linecap="round">
    <line x1="190" y1="60" x2="190" y2="100"/>
    <line x1="80" y1="150" x2="112" y2="172"/>
    <line x1="300" y1="150" x2="268" y2="172"/>
  </g>
  <circle cx="190" cy="210" r="80" fill="#ffcf4d"/>

  <!-- cloud -->
  <g fill="#f5f9fc">
    <ellipse cx="220" cy="360" rx="150" ry="72"/>
    <circle cx="150" cy="330" r="62"/>
    <circle cx="250" cy="300" r="78"/>
    <circle cx="340" cy="335" r="58"/>
  </g>
  <rect x="70" y="360" width="300" height="72" fill="#f5f9fc"/>
</svg>
